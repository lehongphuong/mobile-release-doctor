id: shared.embedded-secrets
version: 0.1.0
title: No credentials embedded in the project
description: >
  Scans text files for private keys, cloud and payment API secrets, signing
  passwords and credential files, using git tracking status to separate
  committed files from local ones. Values are always redacted.
platforms: [ios, android]
frameworks: [flutter, react-native, expo, native-ios, native-android]
category: security
severity: high
max_severity: high
allowed_statuses: [fail, warn, info]
requirement_status: verified
verification:
  level: deterministic
  last_verified: 2026-10-14
policy_references:
  - apple.guideline-5-1-1-data-collection
  - google.user-data-policy
recommendation: >
  Remove credentials from the project and git history, rotate them, and
  keep privileged operations on your backend.
limitations:
  - Generic credential-like assignments are a heuristic and return warn, never fail.
  - Public client identifiers (Firebase / Google API keys) are reported as info, not as leaks.
  - Git history is not scanned; only the current working tree.
introduced_in: 0.1.0
