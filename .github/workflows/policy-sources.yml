name: Policy sources

# Weekly reachability check of the official URLs cited by rules.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node skills/mobile-release-doctor/scripts/validate-policy-sources.mjs
