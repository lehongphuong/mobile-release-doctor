name: False positive / wrong result
description: A rule reported something that is not a problem, or missed a real one.
labels: [false-positive]
body:
  - type: input
    id: rule
    attributes:
      label: Rule ID
      placeholder: apple.permission-purpose-string
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What went wrong?
      options:
        - Reported a problem that is not real (false positive)
        - Missed a real problem (false negative)
        - Wrong severity or status
        - Wrong or outdated policy source
    validations:
      required: true
  - type: input
    id: framework
    attributes:
      label: Framework and version
      placeholder: Flutter 3.29 / React Native 0.77 / Expo SDK 53 ...
  - type: textarea
    id: finding
    attributes:
      label: The finding (JSON or Markdown excerpt)
      description: Remove anything private. Secret values are already redacted by the scanner.
      render: json
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: The smallest files (e.g. an Info.plist or AndroidManifest.xml excerpt) that reproduce it. Please do not share private source code.
    validations:
      required: true
