<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Mobile Release Doctor — catch mobile release issues before App Review">
  <title>Mobile Release Doctor</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#1a1240"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7ee787"/>
      <stop offset="1" stop-color="#79c0ff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="20" fill="url(#bg)"/>
  <!-- phone with a check mark -->
  <g transform="translate(110 55)">
    <rect x="0" y="0" width="120" height="190" rx="22" fill="none" stroke="url(#accent)" stroke-width="6"/>
    <rect x="45" y="14" width="30" height="6" rx="3" fill="#79c0ff" opacity="0.7"/>
    <circle cx="60" cy="98" r="34" fill="none" stroke="#7ee787" stroke-width="6"/>
    <path d="M44 99 l11 11 l22 -24" fill="none" stroke="#7ee787" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M30 160 h60" stroke="#8b949e" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
  </g>
  <g font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="290" y="128" fill="#e6edf3" font-size="58" font-weight="800">Mobile Release Doctor</text>
    <text x="292" y="176" fill="url(#accent)" font-size="28" font-weight="600">Catch mobile release issues before App Review.</text>
    <text x="292" y="222" fill="#8b949e" font-size="20">App Store · Google Play · Flutter · React Native · Expo · native iOS/Android</text>
  </g>
</svg>
